services:
  # ==========================
  # HADOOP MASTER NODE
  # ==========================
  hadoop-master:
    build: ./image
    image: yassern1/hadoop-spark-jupyter:1.0.3-linux
    container_name: hadoop-master
    hostname: hadoop-master
    ports:
      - "9870:9870"    # HDFS NameNode UI
      - "8088:8088"    # YARN ResourceManager UI
      - "7077:7077"    # Spark Master
      - "19888:19888"  # JobHistory Server
      - "8080:8080"    # Jupyter Notebook
      - "9000:9000"    # HDFS RPC
    volumes:
      - "/home/akstrov/Documents/shared_volume:/shared_volume"
    networks:
      - hadoop
    tty: true
    stdin_open: true
    command: sh -c "service ssh start && bash"
    restart: always


  # ==========================
  # HADOOP SLAVE 1
  # ==========================
  hadoop-slave1:
    build: ./image
    image: yassern1/hadoop-spark-jupyter:1.0.3-linux
    container_name: hadoop-slave1
    hostname: hadoop-slave1
    ports:
      - "8040:8042"    # NodeManager Web UI
    networks:
      - hadoop
    tty: true
    stdin_open: true
    command: sh -c "service ssh start && bash"
    restart: always

  # ==========================
  # HADOOP SLAVE 2
  # ==========================
  hadoop-slave2:
    build: ./image
    image: yassern1/hadoop-spark-jupyter:1.0.3-linux
    container_name: hadoop-slave2
    hostname: hadoop-slave2
    ports:
      - "8041:8042"    # NodeManager Web UI
    networks:
      - hadoop
    tty: true
    stdin_open: true
    command: sh -c "service ssh start && bash"
    restart: always
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    hostname: kafka-ui
    networks:
      - hadoop
    ports:
      - "8081:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=hadoop-master:9092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=hadoop-master:2181

# ==========================
# NETWORK
# ==========================
networks:
  hadoop:
    driver: bridge
